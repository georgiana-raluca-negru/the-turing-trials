name: turing

services:
  db:
    image: postgres:16-alpine
    container_name: turing-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: turing-backend
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - DEFAULT_MODEL_NAME=${DEFAULT_MODEL_NAME}
      - LEGAL_GROUNDING_ENABLED=${LEGAL_GROUNDING_ENABLED:-true}
      - PORTAL_LEGISLATIV_URL=${PORTAL_LEGISLATIV_URL:-http://legislatie.just.ro/apiws/FreeWebService.svc/SOAP}
      - LEGAL_HTTP_TIMEOUT_SECONDS=${LEGAL_HTTP_TIMEOUT_SECONDS:-15}
      - LEGAL_MAX_SEARCH_ROUNDS=${LEGAL_MAX_SEARCH_ROUNDS:-2}
      - LEGAL_MAX_ASSESSMENT_CALLS=${LEGAL_MAX_ASSESSMENT_CALLS:-1}
      - LEGAL_MAX_SOURCES=${LEGAL_MAX_SOURCES:-8}
      - LEGAL_MAX_CONTEXT_CHARS=${LEGAL_MAX_CONTEXT_CHARS:-16000}
      
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: turing-frontend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:
